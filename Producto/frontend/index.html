<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Travel Search PRO</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial;
    }

    body {
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 30px;
      text-align: center;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    h2 {
      margin: 20px 0 10px;
      color: #2563eb;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .price {
      color: green;
      font-weight: bold;
      font-size: 18px;
    }

    .rating {
      color: orange;
    }

    .empty {
      text-align: center;
      color: #64748b;
    }

  </style>

</head>

<body>

  <header>
    <h1>✈️ Travel Search PRO</h1>
    <p>Buscador inteligente de vuelos y hoteles</p>
  </header>

  <div class="container">

    <!-- BUSCADOR -->
    <div class="panel">

      <input id="origen" placeholder="Origen (ej: Santiago)">
      <input id="destino" placeholder="Destino (obligatorio)">

      <input type="date" id="fechaIda">
      <input type="date" id="fechaVuelta">

      <input type="number" id="presupuesto" placeholder="Presupuesto total">

      <select id="prioridad">
        <option value="balance">Balance</option>
        <option value="precio">Más barato</option>
        <option value="rating">Mejor rating</option>
      </select>

      <button onclick="buscar()">Buscar</button>

    </div>

    <!-- MENSAJES -->
    <div id="mensaje" class="panel"></div>
    <div id="mensajeFecha" class="panel"></div>

    <!-- RESULTADOS -->
    <h2>⭐ Recomendado</h2>
    <div id="mejor" class="cards"></div>

    <h2>💸 Más económico</h2>
    <div id="economico" class="cards"></div>

    <h2>💰 Opciones más baratas</h2>
    <div id="baratos" class="cards"></div>

    <h2>✈️ Vuelos</h2>
    <div id="vuelos" class="cards"></div>

    <h2>🏨 Hoteles</h2>
    <div id="hoteles" class="cards"></div>

  </div>

  <script>

    async function buscar() {

      const origen = document.getElementById("origen").value.trim();
      const destino = document.getElementById("destino").value.trim();
      const fechaIda = document.getElementById("fechaIda").value;
      const fechaVuelta = document.getElementById("fechaVuelta").value;
      const presupuesto = document.getElementById("presupuesto").value;
      const prioridad = document.getElementById("prioridad").value;

      const mensajeDiv = document.getElementById("mensaje");
      const mensajeFechaDiv = document.getElementById("mensajeFecha");
      const mejorDiv = document.getElementById("mejor");
      const economicoDiv = document.getElementById("economico");
      const vuelosDiv = document.getElementById("vuelos");
      const hotelesDiv = document.getElementById("hoteles");
      const baratosDiv = document.getElementById("baratos");

      // LIMPIAR
      mensajeDiv.innerHTML = "";
      mensajeFechaDiv.innerHTML = "";
      mejorDiv.innerHTML = "";
      economicoDiv.innerHTML = "";
      vuelosDiv.innerHTML = "";
      hotelesDiv.innerHTML = "";
      baratosDiv.innerHTML = "";

      try {

        const res = await fetch(
          `http://localhost:3000/buscar?origen=${encodeURIComponent(origen)}&destino=${encodeURIComponent(destino)}&fechaIda=${fechaIda}&fechaVuelta=${fechaVuelta}&presupuesto=${presupuesto}&prioridad=${prioridad}`
        );

        const data = await res.json();

        console.log("DATA:", data);

        // ERROR
        if (data.error) {
          mensajeDiv.innerHTML = `<div class="card">${data.error}</div>`;
          return;
        }

        // MENSAJES
        if (data.mensaje) {
          mensajeDiv.innerHTML = `<div class="card">${data.mensaje}</div>`;
        }

        if (data.mensajeFecha) {
          mensajeFechaDiv.innerHTML = `<div class="card">${data.mensajeFecha}</div>`;
        }

        // RECOMENDADO
        if (data.mejor && data.mejor.ida && data.mejor.hotel) {
          mejorDiv.innerHTML = `
            <div class="card">
              <h3>⭐ Mejor combinación</h3>
              <p>Total: <span class="price">$${data.mejor.total}</span></p>
              <p>✈️ ${data.mejor.ida.aerolinea}</p>
              <p>🏨 ${data.mejor.hotel.nombre}</p>
            </div>
          `;
        } else {
          mejorDiv.innerHTML = `<div class="card empty">Sin recomendación</div>`;
        }

        // ECONOMICO
        if (data.economico) {
          economicoDiv.innerHTML = `
            <div class="card">
              <h3>💸 Más económico</h3>
              <p>Total: <span class="price">$${data.economico.total}</span></p>
            </div>
          `;
        }

        // MÁS BARATOS
        let htmlBaratos = "";

        if (data.vueloMasBarato) {
          htmlBaratos += `
            <div class="card">
              <h3>✈️ Vuelo más barato</h3>
              <p>${data.vueloMasBarato.aerolinea}</p>
              <p class="price">$${data.vueloMasBarato.precio}</p>
            </div>
          `;
        }

        if (data.hotelMasBarato) {
          htmlBaratos += `
            <div class="card">
              <h3>🏨 Hotel más barato</h3>
              <p>${data.hotelMasBarato.nombre}</p>
              <p class="price">$${data.hotelMasBarato.precio}</p>
            </div>
          `;
        }

        baratosDiv.innerHTML = htmlBaratos || `<div class="card empty">Sin datos</div>`;

        // VUELOS
        if (data.vuelosIda && data.vuelosIda.length > 0) {
          data.vuelosIda.forEach(v => {
            vuelosDiv.innerHTML += `
              <div class="card">
                <h3>${v.aerolinea}</h3>
                <p>${v.origen} → ${v.destino}</p>
                <p class="price">$${v.precio}</p>
              </div>
            `;
          });
        } else {
          vuelosDiv.innerHTML = `<div class="card empty">No hay vuelos</div>`;
        }

        // HOTELES
        if (data.hoteles && data.hoteles.length > 0) {
          data.hoteles.forEach(h => {
            hotelesDiv.innerHTML += `
              <div class="card">
                <h3>${h.nombre}</h3>
                <p>${h.ciudad}</p>
                <p class="rating">⭐ ${h.rating}</p>
                <p class="price">$${h.precio}</p>
              </div>
            `;
          });
        } else {
          hotelesDiv.innerHTML = `<div class="card empty">No hay hoteles</div>`;
        }

      } catch (error) {

        console.error(error);

        mensajeDiv.innerHTML = `
          <div class="card">
            ❌ Error conectando con el servidor
          </div>
        `;
      }

    }

  </script>

</body>
</html>
